<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פלטפורמת תרגום שיחות</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 20px; text-align: center; }
        .chat-box { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0,1); }
        textarea { width: 100%; height: 8px0px; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
        select, button { padding: 10px; width: 100%; margin-bottom: 10px; font-size: 16px; }
        .result { background: #e2f0d9; padding: 15px; border-radius: 5px; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>🗣️ תרגום שיחה בזמן אמת</h2>
    <p>הקלד הודעה בשפה שלך ובחר לאיזו שפה לתרגם עבור הצד השני:</p>
    
    <textarea id="userInput" placeholder="כתוב משהו..."></textarea>
    
    <select id="langSelect">
        <option value="en">אנגלית (English)</option>
        <option value="es">ספרדית (Español)</option>
        <option value="ar">ערבית (العربية)</option>
        <option value="fr">צרפתית (Français)</option>
        <option value="he">עברית</option>
    </select>
    
    <button onclick="sendToTranslate()">שלח ותקשר ותרגם</button>
    
    <div id="resultBox" class="result"></div>
</div>

<script>
    function sendToTranslate() {
        const text = document.getElementById('userInput').value;
        const lang = document.getElementById('langSelect').value;
        const resultBox = document.getElementById('resultBox');

        if(!text) return alert("אנא הקלד טקסט לתרגום");

        fetch('/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, target_lang: lang })
        })
        .then(res => res.json())
        .then(data => {
            if(data.translated_text) {
                resultBox.style.display = "block";
                resultBox.innerHTML = `<strong>התרגום לצד השני:</strong> <br> ${data.translated_text}`;
            } else {
                alert("שגיאה בתרגום");
            }
        });
    }
</script>
</body>
</html>
